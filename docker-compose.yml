services:
  database:
    image: postgres:17-alpine
    container_name: documind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insurance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - documind-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-insurance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SPRING_AI_OPENAI_MODEL: ${SPRING_AI_OPENAI_MODEL:-stepfun/step-3.5-flash:free}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-3600000}
    networks:
      - documind-net

  frontend:
    build:
      context: ../documind-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: documind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    networks:
      - documind-net

networks:
  documind-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
