spring.application.name=documind

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/insurance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:athul}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Spring AI OpenRouter Configuration
spring.ai.openai.api-key=${OPENROUTER_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_MODEL:stepfun/step-3.5-flash:free}
spring.ai.openai.chat.options.temperature=0.0

# Vector Store Persistence
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=policies
spring.ai.vectorstore.chroma.initialize-schema=true

# Security JWT Configuration
security.jwt.secret-key=${JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
# 1h in milliseconds
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html

# Error and Server Settings
server.error.include-message=always
server.error.include-stacktrace=always

# Logging Configuration
logging.level.root=INFO
logging.level.com.athul.documind=INFO
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client=DEBUG